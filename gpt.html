<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kerala tourism</title>

  <style>

    body{
      margin:0;
      overflow-x:hidden;
    }

    .video-bg{
      position: relative;
      height: 100vh;
      overflow: hidden;
    }

    .video-bg iframe{
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 56.25vw;
      min-height: 100vh;
      min-width: 177.77vh;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .content{
      position: relative;
      z-index: 2;
      color: white;
      text-align: center;
      top: 40%;
      font-size: 40px;
      font-family: Arial;
    }

    .overlay{
      position:absolute;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background: rgba(0,0,0,0.5);
      z-index:1;
    }

  </style>
</head>

<body>
  
  <div class="video-bg">

    <iframe
      src="https://www.youtube.com/embed/R83BlU5nnbs?autoplay=1&mute=1&loop=1&playlist=R83BlU5nnbs&controls=0&showinfo=0&modestbranding=1"
      frameborder="0"
      allowfullscreen>
    </iframe>

    <div class="overlay"></div>

    <div class="content">
      <h1>Welcome to Kerala</h1>
      <p>God's Own Country</p>
    </div>

  </div>

</body>
</html>
